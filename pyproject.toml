[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kompasos"
version = "0.1.0"
description = "KompasOS — Enterprise Leave/POS/ERP/Task/Dashboard sistemi"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

# Hədlər `requirements.txt` ilə EYNİ olmalıdır — iki mənbə ayrılsa
# `pip install -e .` ilə `pip install -r requirements.txt` fərqli mühit
# qurardı. Alt hədd = qapılardan keçmiş versiya, üst hədd = növbəti major
# (səbəb: `requirements.txt` başlığı).
dependencies = [
    "PySide6>=6.11,<7.0",
    "cryptography>=50.0,<51.0",
    "argon2-cffi>=25.1,<26.0",
    "supabase>=2.31,<3.0",
    # `pool` ekstrası olmadan `psycopg_pool` quraşdırılmır (bax requirements.txt)
    "psycopg[binary,pool]>=3.3,<4.0",
    "httpx>=0.28,<0.29",
    "pydantic>=2.13,<3.0",
    "python-dotenv>=1.2,<2.0",
    "openpyxl>=3.1,<4.0",
    "Pillow>=12.3,<13.0",
    "tenacity>=9.1,<10.0",
    # --- Native pəncərə davranışı (Aero Snap + Snap Layouts) ---------------- #
    # `sys_platform` markeri və `pywin32`-nin AÇIQ elanı — səbəbləri
    # `requirements.txt`-in eyni adlı bölməsindədir (təkrarlanmır: iki nüsxə
    # şərh bir gün ayrılardı).
    'PySideSix-Frameless-Window>=0.8.2,<0.9; sys_platform == "win32"',
    'pywin32>=312,<400; sys_platform == "win32"',
    # --- Face Control (`facecontrol.md` Faza 3) ---------------------------- #
    # Beş sətrin də QEYRİ-ADİ tərəfi var (`dlib-bin` adı, `--no-deps` tələbi,
    # `setuptools` üst həddi, `headless` variantı) və hər birinin səbəbi
    # `requirements.txt`-in "FACE CONTROL" bölməsində yazılıb. Burada
    # təkrarlanmır: iki nüsxə şərh bir gün ayrılardı.
    "dlib-bin>=20.0,<21.0",
    "numpy>=2.4,<3.0",
    "face_recognition>=1.2,<2.0",
    "face_recognition_models>=0.1,<1.0",
    "setuptools>=80.10,<85.0",
    "opencv-python-headless>=4.13,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10.0",
    "pytest-cov>=7.1,<8.0",
    "pytest-asyncio>=1.4,<2.0",
    "pytest-qt>=4.5,<5.0",
    "pytest-timeout>=2.4,<3.0",
    "mypy>=2.3,<3.0",
    "ruff>=0.16.2,<0.17",
    "pip-audit>=2.7,<3.0",
    "cyclonedx-bom>=7.3,<8.0",
    # Buraxılış aləti də QAPIDIR: PyInstaller-in major buraxılışı bootloader-i
    # və hook-ları dəyişir, yəni pinsiz hədd İMZALANMIŞ `.exe`-ni sınanmamış
    # alətlə qurardı (bax `requirements-dev.txt`).
    "pyinstaller>=6.22,<7.0",
    "types-openpyxl>=3.1",
]

[project.scripts]
kompasos = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

# --------------------------------------------------------------------------- #
# Ruff — linting + formatlama
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # comprehensions
    "DTZ",    # flake8-datetimez — naive datetime qadağandır (NTP/vaxt kritikdir)
    "T20",    # print() qadağandır — struktur logger istifadə olunur
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "S",      # bandit — təhlükəsizlik
    "ANN",    # tip annotasiyaları
    "ASYNC",  # async səhvləri
    "PL",     # pylint alt-dəsti
]
ignore = [
    "ANN401",  # `Any` bəzi generik yerlərdə qaçılmazdır
    "PLR0913", # çox arqumentli konstruktorlar DI-də normaldır
    "S101",    # assert — invariant yoxlamaları üçün istifadə olunur
    # --- Azərbaycan dili ------------------------------------------------- #
    # RUF001/002/003 latın-oxşar simvolları "qeyri-müəyyən" sayır. Azərbaycan
    # əlifbasında ı, ə, ş, ç, ğ, ö, ü NORMAL hərflərdir və bütün sənədləşmə,
    # şərhlər və istifadəçi mesajları bu dildədir (spesifikasiya bölmə 9:
    # "yeganə interfeys dili Azərbaycan dilidir"). Bu qaydalar 1000+ yanlış
    # pozitiv verir və faydalı siqnalı boğur.
    "RUF001",  # sətirdə qeyri-müəyyən simvol
    "RUF002",  # docstring-də qeyri-müəyyən simvol
    "RUF003",  # şərhdə qeyri-müəyyən simvol
    # --- Qəsdən seçilmiş naxışlar ---------------------------------------- #
    # `class X(str, Enum)` — StrEnum-a keçid `str(X.A)` nəticəsini dəyişir
    # ("X.A" → "a") və log/audit çıxışına təsir edə bilər. Açıq `.value`
    # istifadəsi ilə mövcud forma təhlükəsizdir.
    "UP042",
    # Qlobal singleton-lar (get_event_bus / get_container) qəsdən `global`
    # istifadə edir — thread-safe double-checked locking ilə.
    "PLW0603",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004", "S105", "S106", "T20", "PLC0415"]
"src/**/__init__.py" = ["F401"]
# Skriptlər CLI alətidir — stdout-a yazmaq onların əsas işidir
"scripts/**" = ["T20", "PLC0415"]
# Platformaya xas idxallar (ctypes/Win32) qəsdən funksiya daxilindədir —
# Windows-dan kənar mühitdə modul idxalı çökməsin deyə.
"src/infrastructure/security/encryption.py" = ["PLC0415"]
# Qlobal exception hook yalnız Windows/PySide6 mövcud olduqda idxal edir
"src/shared/logger.py" = ["PLC0415"]
# --------------------------------------------------------------------------- #
# Ekran qurucuları (Faza 4) — PLR0915 (çox ifadə)
# --------------------------------------------------------------------------- #
# Qt-də interfeys DEKLARATİV yazılmır: hər etiket, boşluq və yerləşdirmə ayrıca
# ifadədir, ona görə bir ekranın qurulması təbii olaraq 50+ sətir olur. Bu,
# mürəkkəb MƏNTİQ deyil — düz gedən, budaqsız qurma ardıcıllığıdır.
#
# Onu süni "._build_part_1()/._build_part_2()" metodlarına bölmək oxunaqlığı
# ARTIRMIR, əksinə: widget-in harada yarandığı ilə harada layout-a əlavə
# olunduğu bir-birindən ayrılır və maketlə müqayisə etmək çətinləşir.
# Buradakı fayllarda əsl məntiq (süzgəc, validasiya, icazə) ayrıca kiçik
# metodlardadır və onlar bu istisnadan KƏNARDA qalır — çünki PLR0912
# (budaqlanma) və digər qaydalar aktiv olaraq qalır.
"src/presentation/screens/**" = ["PLR0915"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --------------------------------------------------------------------------- #
# MyPy — 100% tip annotasiyası (spesifikasiya bölmə 1)
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
# KompasOS YALNIZ Windows-da işləyir (mağaza PC-ləri, `.exe` paketi). Bu sətir
# olmadan mypy HOST platformasını götürür və CI (ubuntu) `ctypes.windll` /
# `ctypes.GetLastError` üçün "Module has no attribute" verirdi — halbuki həmin
# kod (`WindowsDpapiKeyProvider`) məhz Windows API-sidir və başqa platformada
# ÇAĞIRILMIR. Lokal (Windows) yaşıl, CI (Linux) qırmızı olurdu.
#
# `sys.platform` qapısı ilə həll etmək olmazdı: `warn_unreachable = true`
# həmin bloku bu dəfə "əlçatmaz kod" kimi işarələyərdi. Düzgün cavab mypy-a
# HANSI platforma üçün yoxladığını demək idi.
platform = "win32"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
show_error_codes = true
pretty = true
files = ["src"]
exclude = ["build/", "dist/", "\\.venv/"]

[[tool.mypy.overrides]]
module = ["supabase.*", "argon2.*"]
ignore_missing_imports = true

# `pywin32` və `qframelesswindow` tip stub-u (və ya `py.typed`) daşımır.
# Onlar İKİ dar qatda işlənir: `presentation/shell/native_chrome.py` (Win32
# pəncərə mesajları) və `infrastructure/erp/com_connector.py` (1C COM/OLE).
# Hər ikisində bütün istifadə açıq `Any` ilə çərçivəyə salınıb (`_Win32Api`,
# `dispatcher`). Stub yazmaq real tip təhlükəsizliyi vermir: `HWND` onsuz da
# `int`-dir, `V83.COMConnector` isə tamamilə dinamik `IDispatch` obyektidir.
[[tool.mypy.overrides]]
module = [
    "qframelesswindow.*",
    "win32api",
    "win32com.*",
    "win32con",
    "win32gui",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--timeout=60",
]
asyncio_mode = "auto"
markers = [
    "unit: sürətli, izolyasiya olunmuş domen testləri",
    "integration: DB/şəbəkə tələb edən testlər",
    "e2e: pytest-qt ilə uçdan-uca GUI ssenariləri",
    "qt: PySide6 tələb edir",
    "slow: uzun sürən testlər",
]
filterwarnings = [
    # Öz kodumuzdan gələn RuntimeWarning (məs. await edilməmiş coroutine) xətadır
    "error",
    # Üçüncü tərəf kitabxanalarının köhnəlmə xəbərdarlıqları pipeline-ı qırmasın
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::ResourceWarning",
    # `face_recognition_models` model fayllarının yolunu `pkg_resources` ilə
    # tapır və setuptools bunun üçün UserWarning yayır (DeprecationWarning
    # DEYİL, ona görə yuxarıdakı sətirlərə düşmür). "error" siyasəti altında
    # bu xəbərdarlıq `face_recognition`-un öz `except`-inə düşür və kitabxana
    # `quit()` çağırır — nəticədə üz təsdiqi adapterinin BÜTÜN testləri
    # "kitabxana yoxdur" deyib SÜKUTLA atlanardı. Filtr DAR seçilib (mətnə
    # görə), ümumi `UserWarning` sinfi açıq qalır. Kök səbəb isə onsuz da
    # bağlanıb: `requirements.txt`-dəki `setuptools<81` pini.
    "ignore:pkg_resources is deprecated as an API:UserWarning",
]

# --------------------------------------------------------------------------- #
# Coverage — domen qatı üçün minimum 85% (spesifikasiya bölmə 1)
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = true
source = ["src"]
# TƏQDİMAT QATI NİYƏ ARTIQ GİZLƏDİLMİR
# ---------------------------------------------------------------------------
# Əvvəl burada `*/presentation/*` da vardı. O istisna vaxtilə "GUI ölçülə
# bilmir" fərziyyəsi ilə qoyulmuşdu, lakin bu artıq DOĞRU DEYİL: Faza 5-6-da
# yazı kontrollerləri (`controllers/root_control.py`, `fine_entry.py`,
# `camera_queue.py`, `drive_connection.py`, plugin quraşdırma, baza keçidi,
# bərpa) sırf Python məntiqidir və `tests/` altında sahtələrlə ölçülür.
# İstisna həmin ən riskli yolları HƏR hesabatdan çıxarırdı — yəni orada
# yaranan boşluq heç bir rəqəmdə görünmürdü. Ölçülməyən kod = bilinməyən risk.
#
# RƏSMİ QAPI TƏSİRLƏNMİR: `ci.yml`-dəki qapı `--cov=src/domain --cov=src/shared
# --cov=src/infrastructure/security` ilə çağırılır; `--cov` verilən yollar
# `source`-u əvəz edir, ona görə təqdimat qatı o hesablamaya ONSUZ DA daxil
# deyil və 85% həddi dəyişmir. Bu dəyişiklik yalnız `--cov=src` ilə çağırılan
# TAM hesabatı dürüst edir.
#
# `__init__.py` istisnası qalır: onlar yalnız re-export sətirlərindən ibarətdir
# və ölçüdə iştirakı faizi süni şəkildə şişirdərdi.
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "if __name__ == .__main__.:",
]

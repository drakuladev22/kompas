[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kompasos"
version = "0.1.0"
description = "KompasOS — Enterprise Leave/POS/ERP/Task/Dashboard sistemi"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "PySide6>=6.6,<7.0",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "supabase>=2.4",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "ntplib>=0.4",
    "openpyxl>=3.1",
    "Pillow>=10.2",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.2",
    "mypy>=1.9",
    "ruff>=0.3",
    "pip-audit>=2.7",
    "cyclonedx-bom>=4.4",
    "types-openpyxl",
]

[project.scripts]
kompasos = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

# --------------------------------------------------------------------------- #
# Ruff — linting + formatlama
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # comprehensions
    "DTZ",    # flake8-datetimez — naive datetime qadağandır (NTP/vaxt kritikdir)
    "T20",    # print() qadağandır — struktur logger istifadə olunur
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "S",      # bandit — təhlükəsizlik
    "ANN",    # tip annotasiyaları
    "ASYNC",  # async səhvləri
    "PL",     # pylint alt-dəsti
]
ignore = [
    "ANN401",  # `Any` bəzi generik yerlərdə qaçılmazdır
    "PLR0913", # çox arqumentli konstruktorlar DI-də normaldır
    "S101",    # assert — invariant yoxlamaları üçün istifadə olunur
    # --- Azərbaycan dili ------------------------------------------------- #
    # RUF001/002/003 latın-oxşar simvolları "qeyri-müəyyən" sayır. Azərbaycan
    # əlifbasında ı, ə, ş, ç, ğ, ö, ü NORMAL hərflərdir və bütün sənədləşmə,
    # şərhlər və istifadəçi mesajları bu dildədir (spesifikasiya bölmə 9:
    # "yeganə interfeys dili Azərbaycan dilidir"). Bu qaydalar 1000+ yanlış
    # pozitiv verir və faydalı siqnalı boğur.
    "RUF001",  # sətirdə qeyri-müəyyən simvol
    "RUF002",  # docstring-də qeyri-müəyyən simvol
    "RUF003",  # şərhdə qeyri-müəyyən simvol
    # --- Qəsdən seçilmiş naxışlar ---------------------------------------- #
    # `class X(str, Enum)` — StrEnum-a keçid `str(X.A)` nəticəsini dəyişir
    # ("X.A" → "a") və log/audit çıxışına təsir edə bilər. Açıq `.value`
    # istifadəsi ilə mövcud forma təhlükəsizdir.
    "UP042",
    # Qlobal singleton-lar (get_event_bus / get_container) qəsdən `global`
    # istifadə edir — thread-safe double-checked locking ilə.
    "PLW0603",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004", "S105", "S106", "T20", "PLC0415"]
"src/**/__init__.py" = ["F401"]
# Skriptlər CLI alətidir — stdout-a yazmaq onların əsas işidir
"scripts/**" = ["T20", "PLC0415"]
# Platformaya xas idxallar (ctypes/Win32) qəsdən funksiya daxilindədir —
# Windows-dan kənar mühitdə modul idxalı çökməsin deyə.
"src/infrastructure/security/encryption.py" = ["PLC0415"]
# Qlobal exception hook yalnız Windows/PySide6 mövcud olduqda idxal edir
"src/shared/logger.py" = ["PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --------------------------------------------------------------------------- #
# MyPy — 100% tip annotasiyası (spesifikasiya bölmə 1)
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
show_error_codes = true
pretty = true
files = ["src"]
exclude = ["build/", "dist/", "\\.venv/"]

[[tool.mypy.overrides]]
module = ["supabase.*", "ntplib.*", "pyotp.*", "argon2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--timeout=60",
]
asyncio_mode = "auto"
markers = [
    "unit: sürətli, izolyasiya olunmuş domen testləri",
    "integration: DB/şəbəkə tələb edən testlər",
    "e2e: pytest-qt ilə uçdan-uca GUI ssenariləri",
    "qt: PySide6 tələb edir",
    "slow: uzun sürən testlər",
]
filterwarnings = [
    # Öz kodumuzdan gələn RuntimeWarning (məs. await edilməmiş coroutine) xətadır
    "error",
    # Üçüncü tərəf kitabxanalarının köhnəlmə xəbərdarlıqları pipeline-ı qırmasın
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::ResourceWarning",
]

# --------------------------------------------------------------------------- #
# Coverage — domen qatı üçün minimum 85% (spesifikasiya bölmə 1)
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/__init__.py", "*/presentation/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "if __name__ == .__main__.:",
]

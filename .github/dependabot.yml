# Asılılıq zəiflik izləməsi (spesifikasiya bölmə 1)
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ["dependencies", "security"]
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      # Təhlükəsizlik yamaqları ayrıca, tez merge oluna bilən PR-da
      security-patches:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["ci", "dependencies"]
